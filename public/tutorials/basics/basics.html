<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Basics</title>
  <link rel="stylesheet" href="style.css">
  <script>
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'header.html', false);
    xhr.send();
    if (xhr.status === 200) document.write(xhr.responseText);
  </script>
</head>
<body>
  <article>
    <h1>Markdown Basics</h1>
    <img src="/images/basics.jpg" alt="Markdown Basics">
    <p>Learn the basics of markdown.</p>
<ul>
<li>Use <strong>bold</strong> with double asterisks</li>
<li>Use <em>italic</em> with single asterisks</li>
</ul>
<h2>Headings</h2>
<p>Use # for headings.</p>
  </article>
</body>
</html>
